<!doctype html><html><head><meta charset="utf-8"><title>Native canvas and SVG</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a href="index.html">All examples</a></nav><h1>Native canvas and inline SVG</h1><p>The canvas should show three colored bars, a curved outline, and a label. These are native Vulkan geometry and glyphs.</p>
<canvas id="chart" width="480" height="220" style="background:#07101c"></canvas>
<h2>Inline SVG</h2><svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100"><rect width="320" height="100" rx="16" fill="#1a2637"/><circle cx="52" cy="50" r="30" fill="#91c7ff"/><path d="M110 70 L150 25 L190 70 Z" fill="#80e0ad"/><rect x="220" y="25" width="60" height="50" fill="#ffd78d"/></svg>
<script>const canvas=document.getElementById('chart');const ctx=canvas.getContext('2d');ctx.fillStyle='#91c7ff';ctx.fillRect(40,110,80,70);ctx.fillStyle='#80e0ad';ctx.fillRect(150,65,80,115);ctx.fillStyle='#ffd78d';ctx.fillRect(260,30,80,150);ctx.strokeStyle='#f0f5ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(25,185);ctx.bezierCurveTo(150,190,310,190,410,80);ctx.stroke();ctx.fillStyle='#f0f5ff';ctx.font='18px sans-serif';ctx.fillText('Native Canvas 2D',35,25);</script></body></html>
