name: Release AppImage
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.1.0'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Install native build dependencies and GLFW 3.4
        run: sudo sh scripts/ci/setup-linux.sh
      - name: Install pinned Odin compiler
        run: sh scripts/ci/setup-odin.sh
      - name: Validate tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected SemVer tag vX.Y.Z')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_VERSION={tag[1:]}\nRELEASE_TAG={tag}\n')
          PY
      - name: Build AppImage
        run: |
          make -j"$(nproc)" VERSION="$RELEASE_VERSION" GLSLC="glslangValidator -V"
          sh scripts/build-appimage.sh --version "$RELEASE_VERSION"
          APPIMAGE_EXTRACT_AND_RUN=1 "build/packages/terminal+-$RELEASE_VERSION-x86_64.AppImage" --version
      - name: Sign update metadata
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TERMINAL_PLUS_UPDATE_PRIVATE_KEY }}
        run: |
          set -eu
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          test -n "$UPDATE_PRIVATE_KEY" || { echo 'Set TERMINAL_PLUS_UPDATE_PRIVATE_KEY before publishing.' >&2; exit 1; }
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$key"
          python3 scripts/update-manifest.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --packages build/packages --private-key "$key"
          (cd build/packages && sha256sum *.AppImage update.json update.json.sig > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "Terminal+ $RELEASE_VERSION" --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Never overwrite an already published release.' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" build/packages/* --clobber
          case "$RELEASE_VERSION" in
            *-*) gh release edit "$RELEASE_TAG" --prerelease --draft=false ;;
            *) gh release edit "$RELEASE_TAG" --draft=false --latest ;;
          esac
